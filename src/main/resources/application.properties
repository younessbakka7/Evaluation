# =======================================================
# Configuration Hibernate / JPA - Evaluation
# =======================================================

# Configuration H2 Base Embarquee (Mode compatibilite MySQL pour tests sans serveur externe)
hibernate.connection.driver_class=org.h2.Driver
hibernate.connection.url=jdbc:h2:mem:evaluation_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
hibernate.connection.username=sa
hibernate.connection.password=
hibernate.dialect=org.hibernate.dialect.H2Dialect

# Configuration MySQL (Decommentez pour basculer sur un serveur MySQL local)
# hibernate.connection.driver_class=com.mysql.cj.jdbc.Driver
# hibernate.connection.url=jdbc:mysql://localhost:3306/evaluation_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# hibernate.connection.username=root
# hibernate.connection.password=
# hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Parametres Hibernate DDL et Logging
hibernate.hbm2ddl.auto=create-drop
hibernate.show_sql=false
hibernate.format_sql=true
